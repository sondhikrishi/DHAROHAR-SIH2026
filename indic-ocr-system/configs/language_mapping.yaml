# ============================================================
# SCRIPT-BASED HEURISTIC (for fast language ID without model)
# ============================================================
script_mapping:
  Devanagari: ["hi", "mr", "ne"]
  Bengali: ["bn", "as"]
  Odia: ["or"]
  Tamil: ["ta"]
  Telugu: ["te"]
  Kannada: ["kn"]
  Malayalam: ["ml"]
  Gujarati: ["gu"]
  Gurmukhi: ["pa"]
  Arabic: ["ur"]
  Latin: ["en"]

# ============================================================
# MODEL ROUTING RULES
# ============================================================
routing_rules:
  # For each language, define model priority order
  hi:
    - {model: "paddle_ocr", weight: 1.0, condition: "printed"}
    - {model: "trocr", weight: 0.9, condition: "handprinted"}
    - {model: "tesseract", weight: 0.8, condition: "fallback"}
  
  bn:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "trocr", weight: 0.85}
    - {model: "tesseract", weight: 0.7}
  
  ta:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "easyocr", weight: 0.9}
    - {model: "trocr", weight: 0.8}
  
  te:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "easyocr", weight: 0.9}
    - {model: "trocr", weight: 0.8}
  
  kn:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "easyocr", weight: 0.85}
    - {model: "trocr", weight: 0.8}
  
  ml:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "easyocr", weight: 0.85}
    - {model: "trocr", weight: 0.8}
  
  gu:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "trocr", weight: 0.85}
    - {model: "tesseract", weight: 0.8}
  
  pa:
    - {model: "paddle_ocr", weight: 1.0}
    - {model: "trocr", weight: 0.85}
    - {model: "tesseract", weight: 0.8}
  
  ur:
    - {model: "tesseract", weight: 1.0}
    - {model: "paddle_ocr", weight: 0.8}
    - {model: "trocr", weight: 0.7}
  
  en:
    - {model: "trocr", weight: 1.0}
    - {model: "paddle_ocr", weight: 0.9}
    - {model: "easyocr", weight: 0.85}
    - {model: "tesseract", weight: 0.8}

