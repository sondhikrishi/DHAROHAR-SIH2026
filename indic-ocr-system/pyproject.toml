[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-ocr"
version = "1.0.0"
description = "Multilingual Indian Language OCR System for Land Records"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SIH Hackathon Team", email = "team@sih-hackathon.com"}
]
keywords = [
    "ocr", "indic", "indian-languages", "land-records", 
    "multilingual", "hackathon", "sih", "paddleocr", "trocr"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "opencv-contrib-python>=4.8.0",
    "Pillow>=10.0.0",
    "albumentations>=1.3.0",
    "fasttext>=0.9.2",
    "indic-nlp-library>=1.2.0",
    "indic-transliteration>=1.1.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
gpu = [
    "paddlepaddle-gpu>=2.5.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]
training = [
    "datasets>=2.15.0",
    "evaluate>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/yourteam/indic-ocr-system"
Repository = "https://github.com/yourteam/indic-ocr-system"
Issues = "https://github.com/yourteam/indic-ocr-system/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true