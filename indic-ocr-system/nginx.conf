# Nginx configuration for IndicOCR API
# Place in /etc/nginx/sites-available/indic-ocr and symlink to sites-enabled

upstream indic_ocr_backend {
    # Load balance across multiple workers
    least_conn;
    server localhost:8000 max_fails=3 fail_timeout=30s;
    # Add more workers as needed:
    # server localhost:8001 max_fails=3 fail_timeout=30s;
    # server localhost:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name ocr.yourdomain.com;  # Change to your domain
    
    # Increase timeouts for OCR processing
    client_max_body_size 20M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 300s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # CORS (if needed)
    # add_header Access-Control-Allow-Origin "*";
    # add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    # add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    
    location / {
        proxy_pass http://indic_ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Health check endpoint (no auth)
    location /health {
        proxy_pass http://indic_ocr_backend/health;
        access_log off;
    }
    
    # Metrics endpoint (restrict in production)
    location /metrics {
        proxy_pass http://indic_ocr_backend/metrics;
        allow 10.0.0.0/8;  # Internal network only
        deny all;
    }
    
    # Static files (if serving any)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Documentation
    location /docs {
        proxy_pass http://indic_ocr_backend/docs;
    }
    
    location /redoc {
        proxy_pass http://indic_ocr_backend/redoc;
    }
    
    # API versioning
    location /api/v1/ {
        proxy_pass http://indic_ocr_backend/;
    }
    
    # Rate limiting zone (define in http block)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # location /ocr {
    #     limit_req zone=api burst=10 nodelay;
    #     proxy_pass http://indic_ocr_backend;
    # }
    
    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

